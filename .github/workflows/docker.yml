name: Docker CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build de l'image
        run: docker build --build-arg APP_VERSION=ci -t ministatus:ci .

      - name: Tests dans le conteneur
        run: docker run --rm --entrypoint python ministatus:ci -m unittest -v

      - name: Installer le template HTML Trivy
        run: |
          mkdir -p contrib
          curl -fsSL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o contrib/html.tpl
          test -s contrib/html.tpl

      - name: Rapport Trivy (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ministatus:ci
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Rapport Trivy (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ministatus:ci
          format: template
          template: "@contrib/html.tpl"
          output: trivy-report.html
          exit-code: "0"

      - name: Résumé dans la page du run
        if: always()
        run: |
          echo "### Rapport Trivy" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f trivy-report.json ]; then
            echo "Rapport JSON indisponible." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for s in CRITICAL HIGH MEDIUM; do
            n=$(jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$s\")] | length" trivy-report.json)
            echo "- $s : $n" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-report.*
          if-no-files-found: warn

      - name: Quality gate (HIGH et CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ministatus:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: library
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: build-scan
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ministatus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
